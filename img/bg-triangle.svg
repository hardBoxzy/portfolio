<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 441" fill="none">
  <!-- 三角構図の背景イラスト（頂点を中央上に置き、左右に裾野を広げる） -->

  <!-- 太陽（頂点の後ろ） -->
  <circle cx="330" cy="120" r="56" fill="#e8e8e8"/>

  <!-- 奥の山（左右） -->
  <path d="M40 440 L190 230 L340 440 Z" fill="#ececec"/>
  <path d="M300 440 L460 210 L600 440 Z" fill="#ececec"/>

  <!-- 中央の大きな山（三角構図の主役） -->
  <path d="M110 440 L320 110 L530 440 Z" fill="#dcdcdc"/>
  <!-- 山の陰になる面 -->
  <path d="M320 110 L530 440 L360 440 Z" fill="#cfcfcf"/>
  <!-- 雪の頂 -->
  <path d="M320 110 L282 170 L300 162 L318 178 L338 160 L356 168 Z" fill="#ffffff"/>

  <!-- 手前の小さな山 -->
  <path d="M0 440 L90 330 L180 440 Z" fill="#d4d4d4"/>
  <path d="M440 440 L520 340 L600 440 Z" fill="#d4d4d4"/>

  <!-- 木（小さな三角） -->
  <g fill="#bdbdbd">
    <path d="M220 440 L236 396 L252 440 Z"/>
    <path d="M246 440 L258 408 L270 440 Z"/>
    <path d="M396 440 L410 402 L424 440 Z"/>
  </g>

  <!-- 地面のライン -->
  <line x1="0" y1="440" x2="600" y2="440" stroke="#c9c9c9" stroke-width="2"/>

  <!-- 鳥（三角形の外側に視線を流す） -->
  <g stroke="#c4c4c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M450 110 l12 8 l12 -8"/>
    <path d="M490 140 l9 6 l9 -6"/>
  </g>

  <!-- 装飾ドット -->
  <g fill="#d8d8d8">
    <circle cx="140" cy="200" r="4"/>
    <circle cx="170" cy="160" r="3"/>
    <circle cx="540" cy="250" r="4"/>
  </g>
</svg>
